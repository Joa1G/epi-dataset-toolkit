[project]
name = "epi-dataset-toolkit"
version = "0.1.0"
description = "Curation and auditing tools for PPE object-detection datasets"
readme = "README.md"
authors = [
    { name = "João Gabriel Gomes", email = "j.gabriel.gomes2976@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imagehash>=4.3.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
epi-visualize = "epi_dataset_toolkit.visualize.main:main"
epi-validate = "epi_dataset_toolkit.validate.main:main"
epi-dedup = "epi_dataset_toolkit.dedup.main:main"
epi-split = "epi_dataset_toolkit.split.main:main"
epi-convert = "epi_dataset_toolkit.convert.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
