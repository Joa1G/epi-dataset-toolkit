[project]
name = "yolo-dataset-toolkit"
version = "0.1.0"
description = "Curation and auditing tools for YOLO object-detection datasets"
readme = "README.md"
authors = [
    { name = "João Gabriel Gomes", email = "j.gabriel.gomes2976@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imagehash>=4.3.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
yolo-visualize = "yolo_dataset_toolkit.visualize.main:main"
yolo-validate = "yolo_dataset_toolkit.validate.main:main"
yolo-dedup = "yolo_dataset_toolkit.dedup.main:main"
yolo-split = "yolo_dataset_toolkit.split.main:main"
yolo-convert = "yolo_dataset_toolkit.convert.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
